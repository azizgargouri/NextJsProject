<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline | MoveUp</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f2f1ec;
        color: #101010;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 420px; border: 1px solid #101010; padding: 24px; }
      h1 { margin: 0 0 12px; font-size: 32px; font-weight: 900; line-height: 1; text-transform: uppercase; }
      p { margin: 0 0 20px; color: #3a3a38; line-height: 1.5; }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        background: #101010;
        color: #f2f1ec;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:focus-visible { outline: 2px solid #e61919; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page was not saved on this device yet, so it needs a connection. Your dashboard, offers
        and active jobs open offline once you have used the app online.
      </p>
      <a href="/mover">Try again</a>
    </main>
  </body>
</html>

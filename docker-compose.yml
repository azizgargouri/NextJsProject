# Local object storage for MoveUp (S3-compatible RustFS).
#   docker compose up -d        -> S3 API on :9000, web console on :9001
#   rustfs-init (rustfs/rc) creates the bucket idempotently, then exits.
services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: moveup-rustfs
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-moveupadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-moveupsecret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc:latest
    container_name: moveup-rustfs-init
    depends_on:
      - rustfs
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        until rc alias set local http://rustfs:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1 && rc ready local >/dev/null 2>&1; do sleep 1; done;
        rc bucket create --ignore-existing "local/$$S3_BUCKET" && echo "bucket $$S3_BUCKET ready"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-moveupadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-moveupsecret}
      S3_BUCKET: ${S3_BUCKET:-moveup}
    restart: 'no'

volumes:
  rustfs-data:
